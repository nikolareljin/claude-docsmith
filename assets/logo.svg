<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="title desc">
  <title id="title">Claude Docsmith</title>
  <desc id="desc">A forge anvil striking a document, with a radiant spark above it.</desc>
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E1A24" />
      <stop offset="60%" stop-color="#0F0D13" />
      <stop offset="100%" stop-color="#07060A" />
    </radialGradient>

    <!-- Claude Warm Flame Gradient -->
    <linearGradient id="claudeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E64" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Radiant Forge Spark Gradient -->
    <linearGradient id="forgeSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="30%" stop-color="#FDBA74" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Metallic Steel Anvil Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- High-Contrast Edge Metallic Highlight -->
    <linearGradient id="metalHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.1" />
    </linearGradient>

    <!-- Document Page Gradient -->
    <linearGradient id="docPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Expanded from feDropShadow: several renderers (Inkscape, older
           librsvg) drop the whole filtered group on the shorthand. -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="shadowBlur" />
      <feOffset in="shadowBlur" dx="0" dy="12" result="shadowOffset" />
      <feFlood flood-color="#000000" flood-opacity="0.75" result="shadowColor" />
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Forge Glow -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Ambient Glow for Anvil Center -->
    <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="99" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

  <!-- Background Ambient Heat Atmosphere -->
  <circle cx="256" cy="270" r="160" fill="url(#heatGlow)" filter="url(#intenseGlow)" />

  <g filter="url(#dropShadow)">
    
    <!-- ================= DOCUMENT / REPO BASE ================= -->
    <!-- Backing Document Page (The Raw Code/Repo) -->
    <path d="M 180 110 
             L 300 110 
             L 348 158 
             L 348 358 
             C 348 369.046 339.046 378 328 378 
             L 180 378 
             C 168.954 378 160 369.046 160 358 
             L 160 130 
             C 160 118.954 168.954 110 180 110 Z" 
          fill="url(#docPage)" 
          stroke="#475569" 
          stroke-width="3" />

    <!-- Document Fold Corner -->
    <path d="M 300 110 L 300 158 L 348 158 Z" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <path d="M 300 158 L 348 158" stroke="#64748B" stroke-width="1.5" />

    <!-- Code Syntax / Document Structure Lines -->
    <rect x="192" y="152" width="72" height="7" rx="3.5" fill="#38BDF8" opacity="0.8" />
    <rect x="192" y="174" width="116" height="7" rx="3.5" fill="#64748B" opacity="0.5" />
    <rect x="192" y="196" width="88" height="7" rx="3.5" fill="#64748B" opacity="0.5" />

    <!-- ================= THE ANVIL (FORGE) ================= -->
    <!-- Heavy Anvil Body & Base Structure -->
    <!-- Horn Left, Step, Face Top, Tail Right, Waist, Base -->
    <g id="anvilGroup">
      <!-- Main Anvil Silhouette -->
      <path d="M 124 286 
               C 150 286 168 284 182 278 
               L 356 278 
               C 368 278 376 284 376 290 
               L 360 306 
               L 326 306 
               C 304 322 296 336 294 360 
               L 338 378 
               L 338 392 
               L 174 392 
               L 174 378 
               L 218 360 
               C 216 336 208 322 186 306 
               L 156 306 
               Z" 
            fill="url(#steelGrad)" 
            stroke="#0F172A" 
            stroke-width="4" 
            stroke-linejoin="round" />

      <!-- Top Face Highlight Line (Where impact happens) -->
      <path d="M 176 278 L 356 278" stroke="url(#metalHighlight)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Anvil Base Highlight -->
      <path d="M 174 390 L 338 390" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Code Bracket Embedded on Anvil Face (Conceptual Fusion) -->
      <path d="M 236 322 L 224 334 L 236 346" fill="none" stroke="url(#claudeCore)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 276 322 L 288 334 L 276 346" fill="none" stroke="url(#claudeCore)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="262" y1="318" x2="250" y2="350" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- ================= THE FORGING SPARK (CLAUDE AI) ================= -->
    <!-- Central Radiant Anthropic Spark emerging from the forge impact -->
    <g transform="translate(268, 240)" filter="url(#intenseGlow)">
      <!-- Outer Fire Glow Shell -->
      <path d="M 0 -60 Q 0 0 60 0 Q 0 0 0 60 Q 0 0 -60 0 Q 0 0 0 -60 Z" fill="url(#forgeSpark)" />
      
      <!-- Inner Core Diamond Star -->
      <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FFFFFF" />

      <!-- Burst Sparkles / Molten Embers -->
      <circle cx="-42" cy="-40" r="5" fill="#FF9E64" />
      <circle cx="48" cy="-32" r="4" fill="#FDBA74" />
      <circle cx="38" cy="42" r="3.5" fill="#F97316" />
      <circle cx="-36" cy="36" r="4.5" fill="#FF9E64" />
      
      <circle cx="-18" cy="-54" r="3" fill="#FFF7ED" />
      <circle cx="56" cy="12" r="2.5" fill="#FDBA74" />
      <circle cx="-52" cy="8" r="3" fill="#F97316" />
    </g>

    <!-- Light Reflection Beam from Forge onto Document -->
    <path d="M 268 240 L 160 358 L 160 260 Z" fill="url(#claudeCore)" opacity="0.08" />

  </g>
</svg>
